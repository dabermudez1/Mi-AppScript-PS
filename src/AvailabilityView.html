<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .loading-spinner { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-100" x-data="availabilityView()" x-init="init()">

  <!-- Pantalla de carga -->
  <div x-show="loading" class="fixed inset-0 bg-white bg-opacity-80 flex flex-col items-center justify-center z-50" style="display:none;">
    <div class="loading-spinner h-16 w-16 border-4 border-gray-200 rounded-full mb-4"></div>
    <p class="text-indigo-600 font-bold">Analizando agenda...</p>
  </div>

  <div class="p-4 sm:p-6 lg:p-8" x-cloak>
    <!-- Cabecera y Navegación -->
    <header class="flex justify-between items-center mb-6">
      <div class="flex-1 pr-4">
        <h1 class="text-2xl font-bold text-gray-800">Vista de Disponibilidad</h1>
        <p class="text-lg font-semibold text-indigo-600" x-text="weekOfMonthLabel"></p>
        <p class="text-sm text-gray-500" x-text="`Semana del ${weekData[0]?.dateLabel || ''} al ${weekData[6]?.dateLabel || ''}`"></p>
      </div>
      <!-- Navegación por Fecha -->
      <div class="flex items-center space-x-2 mr-4">
        <span class="text-sm font-medium text-gray-600">Navegar a:</span>
        <input type="date" x-model="jumpDate" @change="jumpToSelectedDate()" 
               class="px-3 py-1.5 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500" 
               title="Seleccionar fecha">
      </div>
      <!-- Filtros -->
      <div class="flex items-center space-x-2 mr-4">
        <span class="text-sm font-medium text-gray-600">Ver huecos para:</span>
        <button @click="setFilter('INDIVIDUAL')" :class="{'bg-indigo-100 text-indigo-700': filter === 'INDIVIDUAL', 'bg-white': filter !== 'INDIVIDUAL'}" class="px-3 py-1.5 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">Individual</button>
        <button @click="setFilter('GRUPO')" :class="{'bg-indigo-100 text-indigo-700': filter === 'GRUPO', 'bg-white': filter !== 'GRUPO'}" class="px-3 py-1.5 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">Grupo</button>
        <button x-show="filter" @click="setFilter(null)" class="px-2 py-1.5 bg-white border-none rounded-md text-sm font-medium text-gray-500 hover:text-gray-800">
          &times; Limpiar
        </button>
      </div>
      <div class="flex items-center space-x-2">
        <button @click="changeWeek(-7)" class="px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">‹ Semana Anterior</button>
        <button @click="changeWeek(0)" class="px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">Semana Actual</button>
        <button @click="changeWeek(7)" class="px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">Semana Siguiente ›</button>
      </div>
    </header>

    <!-- Rejilla de Disponibilidad -->
    <div class="grid grid-cols-7 gap-1 bg-gray-200 p-1 rounded-lg">
      <!-- Cabeceras de Día -->
      <template x-for="day in weekData" :key="day.dateLabel">
        <div class="bg-gray-50 p-2 text-center rounded-t-md">
          <p class="font-bold text-gray-700 text-sm" x-text="day.dayOfWeekLabel"></p>
          <p class="text-xs text-gray-500" x-text="day.dateLabel"></p>
        </div>
      </template>

      <!-- Contenido de Slots -->
      <template x-for="day in weekData" :key="day.dateLabel">
        <div class="bg-white rounded-b-md p-2 space-y-1">
          <template x-if="day.isBlocked">
            <div class="h-full flex items-center justify-center bg-gray-200 rounded-md p-4">
              <p class="text-xs font-semibold text-gray-500 text-center" x-text="day.blockReason"></p>
            </div>
          </template>
          <template x-if="!day.isBlocked && day.slots.length === 0">
             <div class="h-full flex items-center justify-center bg-gray-50 rounded-md p-4">
              <p class="text-xs italic text-gray-400 text-center">Sin plantilla</p>
            </div>
          </template>
          <template x-for="slot in getProcessedSlots(day.slots)" :key="slot.time">
            <div class="relative p-1.5 rounded-md border transition-opacity duration-300" 
                 :class="getSlotClasses(slot)" 
                 :style="`min-height: ${slot.span * 40}px`"
                 :title="getSlotTitle(slot)">
              
              <div class="flex flex-col h-full">
                <p class="text-[10px] font-bold text-gray-800" x-text="slot.time"></p>
                
                <p class="text-[10px] font-semibold" :class="{
                  'text-green-800': slot.templateType.includes('SEGUIMIENTO') || slot.templateType.includes('2.2'),
                  'text-blue-800': slot.templateType.includes('PRIMERA') || slot.templateType.includes('2.1'),
                  'text-purple-800': slot.templateType.includes('GRUPO'),
                  'text-gray-500': slot.status === 'TEMPLATE_REST',
                  'text-red-800': slot.status === 'MISMATCH'
                }" x-text="slot.templateType"></p>

                <!-- Renderizar sub-slots ocupados -->
                <template x-if="slot.status === 'PARTIALLY_OCCUPIED' || slot.status === 'OCCUPIED'">
                  <template x-for="occupied in slot.occupiedSlots" :key="occupied.time">
                    <div x-html="renderOccupiedSubSlot(occupied)"></div>
                  </template>
                </template>

                <!-- Mostrar 'Libre' solo si no está totalmente ocupado -->
                <template x-if="slot.status === 'FREE' || slot.status === 'PARTIALLY_OCCUPIED'">
                   <div class="mt-1 flex-grow flex items-center justify-center">
                    <span class="text-xs font-bold text-green-600">Libre</span>
                  </div>
                </template>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Acciones -->
    <div class="mt-8 flex justify-end">
      <button @click="goBackToPanel()" class="px-6 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 transition">Volver al Panel</button>
    </div>

  </div>

  <script>
    function availabilityView() {
      return {
        loading: true,
        currentDate: new Date(),
        weekData: [],
        weekOfMonthLabel: '',
        filter: null, // 'INDIVIDUAL', 'GRUPO', o null
        // --- CORRECCIÓN: Restaurar la lista de meses, necesaria para las etiquetas ---
        months: ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"],
        jumpDate: new Date().toISOString().split('T')[0], // Para el input[type=date]

        init() {
          this.loadWeekData();
        },
        formatDateForInput(date) {
            return date.toISOString().split('T')[0];
        },

        loadWeekData() {
          this.loading = true;
          const dateISO = this.currentDate.toISOString().split('T')[0];
          
          google.script.run
            .withSuccessHandler(response => {
              this.jumpDate = this.formatDateForInput(this.currentDate);
              this.updateWeekOfMonthLabel(response.weekData);
              this.weekData = response.weekData;
              this.loading = false;
            })
            .withFailureHandler(error => {
              alert('Error al cargar los datos: ' + error.message);
              this.loading = false;
            })
            .getAvailabilityViewData(dateISO);
        },

        changeWeek(days) {
          if (days === 0) {
            this.currentDate = new Date(); // Volver a la semana actual
          } else {
            this.currentDate.setDate(this.currentDate.getDate() + days);
          }
          this.loadWeekData();
        },

        jumpToSelectedDate() {
          if (!this.jumpDate) return;
          this.currentDate = new Date(this.jumpDate + 'T00:00:00'); // Asegurar que se interpreta en la zona horaria local
          this.loadWeekData();
        },

        goBackToPanel() {
          google.script.run.withSuccessHandler(() => google.script.host.close()).volverAlPanelDesdeDisponibilidad();
        },

        setFilter(type) {
          this.filter = (this.filter === type) ? null : type;
        },

        getSlotClasses(slot) {
          const type = String(slot.templateType || '').toUpperCase();
          let bgColor = 'bg-gray-50'; // Default
          const classes = { 'border-gray-200': true };

          if (slot.status === 'FREE' || slot.status === 'OCCUPIED') {
            if (type.includes('SEGUIMIENTO') || type.includes('2.2')) { bgColor = 'bg-green-50'; }
            else if (type.includes('PRIMERA') || type.includes('2.1')) { bgColor = 'bg-blue-50'; }
            else if (type.includes('GRUPO')) { bgColor = 'bg-purple-50'; }
          }
          if (slot.status === 'OCCUPIED') {
            classes['border-gray-500'] = true;
            classes['border-2'] = true; // Borde más grueso
          }
          // --- NUEVO: Resaltar si la sesión no coincide con el tipo de slot ---
          if (slot.status === 'OCCUPIED' && slot.sessionModality === 'INDIVIDUAL' && type.includes('GRUPO')) {
            classes['border-red-500'] = true; // Individual en hueco de grupo
          }
          if (slot.status === 'OCCUPIED' && slot.sessionModality !== 'INDIVIDUAL' && (type === 'PRIMERA' || type === 'SEGUIMIENTO')) {
            classes['border-red-500'] = true; // Grupo en hueco individual
          }
          if (slot.status === 'TEMPLATE_REST') { bgColor = 'bg-gray-100'; }
          if (slot.status === 'MISMATCH') { bgColor = 'bg-red-50'; }

          return {
            [bgColor]: true,
            ...classes,
            'opacity-30': this.filter && !this.isSlotHighlighted(slot)
          };
        },

        /**
         * Procesa los slots para agruparlos visualmente y calcular expansiones.
         * Esta es la nueva lógica de agrupación.
         */
        getProcessedSlots(slots) {
          if (!slots) return [];
          const processed = JSON.parse(JSON.stringify(slots)); // Deep copy

          for (let i = 0; i < processed.length; i++) {
            const slot = processed[i];
            if (slot.isHidden) continue; // Ya fue procesado por una agrupación anterior

            slot.span = 1; // Por defecto, cada slot ocupa 1 bloque

            // Lógica para sesiones OCUPADAS (se expanden según su duración real)
            if (slot.status === 'OCCUPIED') {
              const slotsToSpan = Math.ceil((slot.durationMinutes || 30) / 30);
              if (slotsToSpan > 1) {
                slot.span = slotsToSpan;
                for (let j = 1; j < slotsToSpan; j++) if (i + j < processed.length) processed[i + j].isHidden = true;
              }
              continue; // Pasar al siguiente slot
            }

            // Lógica para slots LIBRES (intentamos agruparlos)
            if (slot.status === 'FREE') {
              const type = String(slot.templateType || '').toUpperCase();

              // Intentar agrupar para GRUPO (90 min)
              if (type.includes('GRUPO') && i + 2 < processed.length &&
                  processed[i + 1].status === 'FREE' && String(processed[i + 1].templateType).toUpperCase().includes('GRUPO') &&
                  processed[i + 2].status === 'FREE' && String(processed[i + 2].templateType).toUpperCase().includes('GRUPO')) {
                
                slot.span = 3;
                slot.templateType = 'GRUPO (90 min)'; // Etiqueta agrupada
                processed[i + 1].isHidden = true;
                processed[i + 2].isHidden = true;
                i += 2; // Avanzar el índice para saltar los slots ya agrupados
                continue;
              }

              // Intentar agrupar para PRIMERA (60 min)
              if ((type === 'PRIMERA' || type === '2.1') && i + 1 < processed.length &&
                  processed[i + 1].status === 'FREE' && (String(processed[i + 1].templateType).toUpperCase() === 'PRIMERA' || String(processed[i + 1].templateType).toUpperCase() === '2.1')) {
                
                slot.span = 2;
                slot.templateType = 'PRIMERA (60 min)'; // Etiqueta agrupada
                processed[i + 1].isHidden = true;
                i += 1; // Avanzar el índice
                continue;
              }
            }
          }
          return processed;
        },

        isSlotHighlighted(slot) {
          if (!this.filter) return true; // Si no hay filtro, todo está "resaltado"
          if (slot.status !== 'FREE') return false; // Solo resaltamos huecos libres

          const slotType = String(slot.templateType || '').toUpperCase();

          if (this.filter === 'INDIVIDUAL') {
            // Un slot individual es para 'SEGUIMIENTO' o 'PRIMERA'
            return slotType === 'SEGUIMIENTO' || slotType === '2.2' || slotType === 'PRIMERA' || slotType === '2.1';
          }
          
          if (this.filter === 'GRUPO') {
            // Un slot de grupo es cualquiera que contenga 'GRUPO'
            return slotType.includes('GRUPO');
          }

          return false;
        },

        getSlotTitle(slot) {
            if (slot.status === 'OCCUPIED') {
                return `Ocupado por: ${slot.occupiedBy} (Sesión ${slot.sessionNumber || 'N/A'})`;
            }
            if (slot.status === 'FREE') {
                return `Libre | Tipo de plantilla: ${slot.templateType}`;
            }
            if (slot.status === 'TEMPLATE_REST') {
                return 'Descanso definido en la plantilla';
            }
            return `Slot a las ${slot.time}`;
        },

        getEmojiForStatus(status) {
          switch (status) {
            case 'PENDIENTE':
              return '🗓️';
            case 'REPROGRAMADA':
              return '🔁';
            case 'COMPLETADA_AUTO':
            case 'COMPLETADA_MANUAL':
              return '✅';
            default: return '';
          }
        },

        updateWeekOfMonthLabel(weekData) {
            if (!weekData || weekData.length === 0) {
                this.weekOfMonthLabel = '';
                return;
            }
            const firstDayStr = weekData[0].dateLabel; // "DD/MM/YYYY"
            const parts = firstDayStr.split('/');
            const date = new Date(parts[2], parts[1] - 1, parts[0]);
            
            const weekNumber = Math.ceil((date.getDate() + (date.getDay() === 0 ? 6 : date.getDay() - 1)) / 7);
            const monthName = this.months[date.getMonth()];
            this.weekOfMonthLabel = `Semana ${weekNumber} de ${monthName}`;
        },

        // Helper para formatear la fecha para la cabecera
        formatDate(date) {
          const d = new Date(date);
          const day = String(d.getDate()).padStart(2, '0');
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const year = d.getFullYear();
          return `${day}/${month}/${year}`;
        }
      }
    }
  </script>
</body>
</html>
